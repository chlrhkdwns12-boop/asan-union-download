    <button class="zbtn" id="zIn" aria-label="확대">+</button>
    <button class="zbtn" id="zClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="zstage" id="zStage"><img id="zImg" alt=""></div>
  <div class="zfoot">손가락으로 벌리면 더 크게 · 두 번 탭하면 원래 크기</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PAGES = [
    {t:"표지", a:"표지 — 조합원 노동법 수첩 2026", ch:"표지"},
    {t:"목차", a:"목차 — 궁금한 곳부터 펴 보세요, 노동상담소 연락처", ch:"목차"},
    {t:"① 근로계약", a:"① 근로계약 — 근로계약서 8가지 기재사항과 위반 시 벌금", ch:"근로계약"},
    {t:"① 근로계약", a:"① 근로계약 — 기간제·단시간 기재사항, 표준근로계약서", ch:"근로계약"},
    {t:"② 근로시간", a:"② 근로시간 — 법정근로시간과 소정근로시간, 연장 12시간, 가산수당", ch:"근로시간"},
    {t:"② 근로시간", a:"② 근로시간 — 휴게시간, 유급휴일, 연차", ch:"근로시간"},
    {t:"③ 임금", a:"③ 임금 — 임금의 개념과 4대 원칙, 임금명세서", ch:"임금"},
    {t:"③ 임금", a:"③ 임금 — 통상임금과 평균임금", ch:"임금"},
    {t:"③ 임금", a:"③ 임금 — 퇴직 후 14일, 임금체불, 소멸시효·공소시효", ch:"임금"},
    {t:"④ 최저임금", a:"④ 최저임금 — 2026년 시간급 10,320원, 수습 감액", ch:"최저임금"},
    {t:"④ 최저임금", a:"④ 최저임금 — 산입·미산입, 판단방법", ch:"최저임금"},
    {t:"④ 최저임금", a:"④ 최저임금 — 연도별 최저임금, 감액할 수 없는 직종", ch:"최저임금"},
    {t:"⑤ 괴롭힘·모성", a:"⑤ 직장 내 괴롭힘 — 금지행위와 사업주 조치 의무", ch:"괴롭힘·모성"},
    {t:"⑤ 괴롭힘·모성", a:"⑤ 직장 내 성희롱 — 금지행위와 사업주 조치 의무", ch:"괴롭힘·모성"},
    {t:"⑤ 괴롭힘·모성", a:"⑤ 일·가정 양립 — 출산전후휴가, 배우자 출산휴가, 난임치료휴가", ch:"괴롭힘·모성"},
    {t:"⑥ 해고", a:"⑥ 해고 — 해고 제한과 30일 전 예고", ch:"해고·퇴직"},
    {t:"⑥ 해고", a:"⑥ 해고 — 해고예고수당 계산", ch:"해고·퇴직"},
    {t:"⑦ 퇴직급여", a:"⑦ 퇴직급여 — 퇴직금제도와 계속근로기간", ch:"해고·퇴직"},
    {t:"⑦ 퇴직급여", a:"⑦ 퇴직급여 — 퇴직금 계산식과 예시", ch:"해고·퇴직"},
    {t:"⑧ Q&A", a:"⑧ 고용노동 Q&A 1~5", ch:"Q&A"},
    {t:"⑧ Q&A", a:"⑧ 고용노동 Q&A 6~10", ch:"Q&A"},
    {t:"마무리", a:"마무리 — 무료 노동상담 연락처", ch:"마무리"}
  ];
  var CHAPS = [
    {n:"표지", p:1}, {n:"목차", p:2}, {n:"근로계약", p:3}, {n:"근로시간", p:5},
    {n:"임금", p:7}, {n:"최저임금", p:10}, {n:"괴롭힘·모성", p:13},
    {n:"해고·퇴직", p:16}, {n:"Q&A", p:20}, {n:"마무리", p:22}
  ];
  var TOTAL = PAGES.length;
  var src = function(n){ return "img/p" + String(n).padStart(2,"0") + ".webp"; };

  var stage = document.getElementById("stage");
  var book  = document.getElementById("book");
  var leaf  = document.getElementById("leaf");
  var pageImg = document.getElementById("pageImg");
  var shade = document.getElementById("shade");
  var edgeShade = document.getElementById("edgeShade");
  var under = document.getElementById("under");
  var underImg = document.getElementById("underImg");
  var chapName = document.getElementById("chapName");
  var curNum = document.getElementById("curNum");
  var bar = document.getElementById("bar");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var chipsEl = document.getElementById("chips");
  var hint = document.getElementById("hint");

  var idx = 1, busy = false, DUR = 420;

  /* ── 크기 계산 ── */
  function fit(){
    var r = stage.getBoundingClientRect();
    var w = Math.min(r.width, r.height * (2/3));
    if (w < 40) w = r.width;
    book.style.setProperty("--bookw", w + "px");
    book.style.setProperty("--bookh", (w * 1.5) + "px");
    book.style.width = w + "px";
    book.style.height = (w * 1.5) + "px";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 120); });

  /* ── 칩 ── */
  var chipEls = CHAPS.map(function(c){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = c.n;
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){ goTo(c.p, c.p > idx ? 1 : -1); });
    chipsEl.appendChild(b);
    return b;
  });

  var zPrev = document.getElementById("zPrev"), zNext = document.getElementById("zNext");

  function chapterOf(n){
    var cur = CHAPS[0];
    for (var i=0;i<CHAPS.length;i++) if (CHAPS[i].p <= n) cur = CHAPS[i];
    return cur;
  }

  function ui(){
    var pg = PAGES[idx-1];
    curNum.textContent = idx;
    chapName.textContent = chapterOf(idx).n;
    bar.style.width = (idx / TOTAL * 100) + "%";
    prevBtn.setAttribute("aria-disabled", idx <= 1 ? "true" : "false");
    nextBtn.setAttribute("aria-disabled", idx >= TOTAL ? "true" : "false");
    var act = chapterOf(idx).n;
    chipEls.forEach(function(b){ b.setAttribute("aria-current", b.textContent === act ? "true" : "false"); });
    // 활성 칩이 보이게
    var ac = chipEls.find(function(b){ return b.getAttribute("aria-current") === "true"; });
    if (ac && chipsEl.scrollWidth > chipsEl.clientWidth){
      var l = ac.offsetLeft - chipsEl.clientWidth/2 + ac.offsetWidth/2;
      chipsEl.scrollTo({ left: Math.max(0, l), behavior: "smooth" });
    }
    document.getElementById("zTitle").textContent = pg.t + " · " + idx + " / " + TOTAL + "쪽";
    try { history.replaceState(null, "", "#p=" + idx); } catch(e){}
    if (hint) { if (idx > 1) hint.style.opacity = "0"; }
  }

  function setLeaf(n){
    leaf.classList.add("loading");
    var im = new Image();
    im.onload = function(){ pageImg.src = im.src; pageImg.alt = PAGES[n-1].a; leaf.classList.remove("loading"); };
    im.onerror = function(){ pageImg.src = src(n); leaf.classList.remove("loading"); };
    im.src = src(n);
  }
  function setUnder(n){
    if (!n){ underImg.removeAttribute("src"); under.style.display = "none"; return; }
    under.style.display = "block";
    underImg.src = src(n);
    underImg.alt = "";
    under.classList.add("dim");
  }
  function resetLeaf(){
    leaf.style.transition = "none";
    leaf.style.transform = "rotateY(0deg)";
    leaf.style.opacity = "1";
    shade.style.opacity = "0";
    edgeShade.style.opacity = "0";
    void leaf.offsetWidth;
  }

  /* ── 페이지 넘김 ── */
  function turn(dir){
    if (busy) return;
    var nxt = idx + dir;
    if (nxt < 1 || nxt > TOTAL){ bump(dir); return; }
    busy = true;
    var T = "transform " + DUR + "ms cubic-bezier(.22,.61,.36,1), opacity " + DUR + "ms ease";

    if (dir > 0){
      setUnder(nxt);
      resetLeaf();
      leaf.style.transition = T;
      requestAnimationFrame(function(){
        leaf.style.transform = "rotateY(-86deg)";
        shade.style.opacity = "0.55";
        edgeShade.style.opacity = "0.6";
      });
      setTimeout(function(){
        idx = nxt; resetLeaf(); setLeaf(idx); setUnder(null); leaf.classList.remove("turning");
        ui(); busy = false;
      }, DUR - 10);
    } else {
      under.style.display = "block";
      underImg.src = src(idx); underImg.alt = ""; under.classList.add("dim");
      leaf.classList.add("loading");
      pageImg.src = src(nxt); pageImg.alt = PAGES[nxt-1].a;
      leaf.classList.remove("loading");
      resetLeaf();
      leaf.style.transform = "rotateY(-86deg)";
      void leaf.offsetWidth;
      leaf.style.transition = T;
      requestAnimationFrame(function(){ leaf.style.transform = "rotateY(0deg)"; shade.style.opacity = "0"; edgeShade.style.opacity = "0"; });
      setTimeout(function(){
        idx = nxt; resetLeaf(); setLeaf(idx); setUnder(null);
        ui(); busy = false;
      }, DUR - 10);
    }
  }

  function bump(dir){
    if (busy) return;
    busy = true;
    var o = dir > 0 ? -7 : 7;
    resetLeaf();
    leaf.style.transition = "transform 150ms ease";
    leaf.style.transform = "translateX(" + o + "px)";
    setTimeout(function(){
      leaf.style.transform = "translateX(0)";
      setTimeout(function(){ resetLeaf(); busy = false; }, 160);
    }, 120);
    toastMsg(dir > 0 ? "마지막 쪽입니다" : "첫 쪽입니다");
  }

  function goTo(n, dir){
    n = Math.max(1, Math.min(TOTAL, n));
    if (n === idx || busy) return;
    dir = dir || (n > idx ? 1 : -1);
    if (Math.abs(n - idx) === 1) { turn(dir); return; }
    // 멀리 뛰기: 살짝 접었다 새 쪽으로
    busy = true;
    leaf.style.transition = "transform 200ms ease, opacity 200ms ease";
    leaf.style.transform = "rotateY(28deg)";
    leaf.style.opacity = "0.25";
    setTimeout(function(){
      idx = n; resetLeaf(); setLeaf(idx); leaf.style.opacity = "1"; ui(); busy = false;
    }, 200);
  }

  prevBtn.addEventListener("click", function(){ turn(-1); });
  nextBtn.addEventListener("click", function(){ turn(1); });

  /* ── 드래그 넘김 ── */
  var drag = null;
  stage.addEventListener("pointerdown", function(e){
    if (busy) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, dx: 0, t: Date.now(), active: false, dir: 0, p: 0,
             id: e.pointerId, w: book.offsetWidth };
    leaf.classList.add("turning");
  });
  stage.addEventListener("pointermove", function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.active){
      if (Math.abs(dx) < 9) return;
      if (Math.abs(dy) > Math.abs(dx) * 1.1) { drag = null; return; }
      drag.active = true;
      drag.dir = dx < 0 ? 1 : -1;
      if (drag.dir > 0){
        if (idx + 1 > TOTAL){ drag = null; bump(1); return; }
        setUnder(idx + 1);
        resetLeaf();
      } else {
        if (idx - 1 < 1){ drag = null; bump(-1); return; }
        underImg.src = src(idx); underImg.alt = ""; under.style.display = "block"; under.classList.add("dim");
        pageImg.src = src(idx - 1); pageImg.alt = PAGES[idx-2].a;
        resetLeaf();
      }
    }
    e.preventDefault();
    drag.dx = dx;
    var p = Math.min(1, Math.max(0, Math.abs(dx) / (drag.w * 0.62)));
    drag.p = p;
    if (drag.dir > 0){
      leaf.style.transform = "rotateY(" + (-86 * p) + "deg)";
      shade.style.opacity = String(0.55 * p);
      edgeShade.style.opacity = String(0.62 * p);
    } else {
      leaf.style.transform = "rotateY(" + (-86 * (1 - p)) + "deg)";
      shade.style.opacity = String(0.55 * (1 - p));
      edgeShade.style.opacity = String(0.62 * (1 - p));
    }
  }, { passive: false });

  function endDrag(e){
    if (!drag || (e && e.pointerId !== drag.id)) return;
    leaf.classList.remove("turning");
    if (!drag.active){ drag = null; resetLeaf(); return; }
    var d = drag; drag = null;
    var fast = (Date.now() - d.t) < 320 && Math.abs(d.dx) > 36;
    var commit = d.p > 0.32 || fast;
    var T = "transform 300ms cubic-bezier(.22,.61,.36,1), opacity 300ms ease";
    leaf.style.transition = T;
    if (commit){
      busy = true;
      var target = d.dir > 0 ? idx + 1 : idx - 1;
      leaf.style.transform = "rotateY(" + (d.dir > 0 ? -90 : 0) + "deg)";
      shade.style.opacity = d.dir > 0 ? "0.55" : "0";
      edgeShade.style.opacity = d.dir > 0 ? "0.6" : "0";
      setTimeout(function(){
        idx = target; resetLeaf(); setLeaf(idx); setUnder(null); ui(); busy = false;
      }, 290);
    } else {
      leaf.style.transform = d.dir > 0 ? "rotateY(0deg)" : "rotateY(-86deg)";
      shade.style.opacity = d.dir > 0 ? "0" : "0.55";
      edgeShade.style.opacity = d.dir > 0 ? "0" : "0.6";
      setTimeout(function(){ setUnder(null); resetLeaf(); }, 300);
    }
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("pointerleave", function(e){ if (drag && e.pointerType === "mouse") endDrag(e); });

  /* 키보드 */
  document.addEventListener("keydown", function(e){
    if (document.getElementById("zoom").classList.contains("on")){
      if (e.key === "Escape") closeZoom();
      if (e.key === "ArrowRight" || e.key === "PageDown") zNav(1);
      if (e.key === "ArrowLeft" || e.key === "PageUp") zNav(-1);
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); turn(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); turn(-1); }
    else if (e.key === "Home"){ e.preventDefault(); goTo(1, -1); }
    else if (e.key === "End"){ e.preventDefault(); goTo(TOTAL, 1); }
  });
  /* 데스크톱 휠 */
  var wheelLock = 0;
  stage.addEventListener("wheel", function(e){
    var now = Date.now();
    if (now < wheelLock) return;
    if (Math.abs(e.deltaY) < 8 && Math.abs(e.deltaX) < 8) return;
    e.preventDefault();
    wheelLock = now + 480;
    turn((e.deltaY || e.deltaX) > 0 ? 1 : -1);
  }, { passive: false });

  /* ── 확대 보기 ── */
  var zoom = document.getElementById("zoom");
  var zStage = document.getElementById("zStage");
  var zImg = document.getElementById("zImg");
  var zs = 1, zx = 0, zy = 0, zBaseW = 0, zBaseH = 0;

  function zApply(){
    if (zs <= 1.001){ zs = 1; zx = 0; zy = 0; }
    var r = zStage.getBoundingClientRect();
    var iw = zImg.clientWidth * zs, ih = zImg.clientHeight * zs;
    var mx = Math.max(0, (iw - r.width) / 2 + 12);
    var my = Math.max(0, (ih - r.height) / 2 + 12);
    zx = Math.max(-mx, Math.min(mx, zx));
    zy = Math.max(-my, Math.min(my, zy));
    zImg.style.transform = "translate3d(" + zx + "px," + zy + "px,0) scale(" + zs + ")";
  }
  function zSet(s, cx, cy){
    s = Math.max(1, Math.min(5, s));
    if (cx == null){ cx = 0; cy = 0; }
    var k = s / zs;
    zx = cx - k * (cx - zx);
    zy = cy - k * (cy - zy);
    zs = s;
    zApply();
  }
  function openZoom(n){
    idx = Math.max(1, Math.min(TOTAL, n || idx));
    zImg.src = src(idx);
    zImg.alt = PAGES[idx-1].a;
    zs = 1; zx = 0; zy = 0; zApply();
    zoom.classList.add("on");
    document.getElementById("zTitle").textContent = PAGES[idx-1].t + " · " + idx + " / " + TOTAL + "쪽";
    ui();
  }
  function closeZoom(){ zoom.classList.remove("on"); zs = 1; zx = 0; zy = 0; zImg.style.transform = ""; }
  function zNav(d){
    var n = idx + d;
    if (n < 1 || n > TOTAL) return;
    idx = n;
    zImg.src = src(idx); zImg.alt = PAGES[idx-1].a;
    zs = 1; zx = 0; zy = 0; zApply();
    document.getElementById("zTitle").textContent = PAGES[idx-1].t + " · " + idx + " / " + TOTAL + "쪽";
    setLeaf(idx); resetLeaf(); ui();
  }
  document.getElementById("zoomBtn").addEventListener("click", function(){ openZoom(idx); });
  document.getElementById("zClose").addEventListener("click", closeZoom);
  document.getElementById("zIn").addEventListener("click", function(){ zSet(zs * 1.5); });
  document.getElementById("zOut").addEventListener("click", function(){ zSet(zs / 1.5); });
  zPrev.addEventListener("click", function(){ zNav(-1); });
  zNext.addEventListener("click", function(){ zNav(1); });

  var zp = [], zStart = null, zTap = 0, zTapX = 0, zTapY = 0;
  zStage.addEventListener("pointerdown", function(e){
    zStage.setPointerCapture && zStage.setPointerCapture(e.pointerId);
    zp.push({ id: e.pointerId, x: e.clientX, y: e.clientY });
    if (zp.length === 1){
      zStart = { x: e.clientX, y: e.clientY, tx: zx, ty: zy, s: zs, d: 0 };
    } else if (zp.length === 2){
      zStart = { d: dist(zp[0], zp[1]), s: zs, mx: (zp[0].x+zp[1].x)/2, my: (zp[0].y+zp[1].y)/2, tx: zx, ty: zy };
    }
  });
  function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }
  zStage.addEventListener("pointermove", function(e){
    var i = zp.findIndex(function(p){ return p.id === e.pointerId; });
    if (i < 0) return;
    zp[i].x = e.clientX; zp[i].y = e.clientY;
    if (!zStart) return;
    e.preventDefault();
    if (zp.length === 1 && zStart.s){
      zx = zStart.tx + (e.clientX - zStart.x);
      zy = zStart.ty + (e.clientY - zStart.y);
      zStart.d = Math.hypot(e.clientX - zStart.x, e.clientY - zStart.y);
      zApply();
    } else if (zp.length === 2 && zStart.d){
      var r = zStage.getBoundingClientRect();
      var s = Math.max(1, Math.min(5, zStart.s * (dist(zp[0], zp[1]) / zStart.d)));
      var cx = (zp[0].x + zp[1].x)/2 - (r.left + r.width/2);
      var cy = (zp[0].y + zp[1].y)/2 - (r.top + r.height/2);
      zs = zStart.s; zx = zStart.tx; zy = zStart.ty;
      zSet(s, cx, cy);
    }
  }, { passive: false });
  function zUp(e){
    zp = zp.filter(function(p){ return p.id !== e.pointerId; });
    if (zp.length === 0){
      if (zStart && zStart.d < 8 && zs === zStart.s){
        var now = Date.now();
        if (now - zTap < 320 && Math.hypot(e.clientX - zTapX, e.clientY - zTapY) < 40){
          var r = zStage.getBoundingClientRect();
          zSet(zs > 1.2 ? 1 : 2.4, e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
          zTap = 0;
        } else { zTap = now; zTapX = e.clientX; zTapY = e.clientY; }
      }
      zStart = null;
    } else if (zp.length === 1){
      zStart = { x: zp[0].x, y: zp[0].y, tx: zx, ty: zy, s: zs, d: 0 };
    }
  }
  zStage.addEventListener("pointerup", zUp);
  zStage.addEventListener("pointercancel", zUp);
  zStage.addEventListener("wheel", function(e){
    e.preventDefault();
    var r = zStage.getBoundingClientRect();
    zSet(zs * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
  }, { passive: false });
  window.addEventListener("resize", function(){ if (zoom.classList.contains("on")) zApply(); });

  /* ── 공유 ── */
  function toastMsg(m){
    var t = document.getElementById("toast");
    t.textContent = m; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1900);
  }
  var home = location.origin + location.pathname;
  document.getElementById("shareBtn").addEventListener("click", async function(){
    var url = home;
    var data = { title: "조합원 노동법 수첩 2026 · 전 22쪽", text: "일하다 궁금할 때 한 번씩 펴 보는 노동법 수첩. 폰에서 책처럼 넘겨 보세요.", url: url };
    try {
      if (navigator.share){ await navigator.share(data); return; }
      await navigator.clipboard.writeText(url);
      toastMsg("링크를 복사했어요. 단톡방에 붙여 넣으세요");
    } catch(err){
      if (err && err.name === "AbortError") return;
      try { await navigator.clipboard.writeText(url); toastMsg("링크를 복사했어요. 단톡방에 붙여 넣으세요"); }
      catch(e2){ toastMsg("주소창의 주소를 복사해 공유해 주세요"); }
    }
  });

  /* ── 시작 ── */
  function fromHash(){
    var m = (location.hash || "").match(/p=(\d+)/);
    return m ? Math.max(1, Math.min(TOTAL, parseInt(m[1],10))) : 1;
  }
  idx = fromHash();
  fit();
  setLeaf(idx);
  pageImg.alt = PAGES[idx-1].a;
  resetLeaf();
  ui();

  // 나머지 쪽 미리 받기 (3장씩)
  var q = [];
  for (var i=1;i<=TOTAL;i++) if (i !== idx) q.push(i);
  function pump(){
    if (!q.length) return;
    var n = q.shift();
    var im = new Image();
    im.onload = im.onerror = function(){ setTimeout(pump, 60); };
    im.src = src(n);
  }
  if ("requestIdleCallback" in window) requestIdleCallback(function(){ pump(); }, { timeout: 1800 });
  else setTimeout(pump, 900);

  window.addEventListener("hashchange", function(){
    var n = fromHash();
    if (n !== idx) goTo(n);
  });
})();
</script>
</body>
</html>
