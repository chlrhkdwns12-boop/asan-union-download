  ];
  var CHAPS = [
    {n:"표지", p:1}, {n:"목차", p:2}, {n:"근로계약", p:3}, {n:"근로시간", p:5},
    {n:"임금", p:7}, {n:"최저임금", p:10}, {n:"괴롭힘·모성", p:13},
    {n:"해고·퇴직", p:16}, {n:"Q&A", p:20}, {n:"마무리", p:22}
  ];
  var TOTAL = PAGES.length;
  function src(n){ return "img/p" + String(n).padStart(2,"0") + ".webp"; }

  /* ── DOM ── */
  var stage = document.getElementById("stage");
  var book  = document.getElementById("book");
  var imgL  = document.getElementById("imgL");
  var imgR  = document.getElementById("imgR");
  var pageL = document.getElementById("pageL");
  var pageR = document.getElementById("pageR");
  var canvas = document.getElementById("curl");
  var chapName = document.getElementById("chapName");
  var curNum = document.getElementById("curNum");
  var bar = document.getElementById("bar");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var chipsEl = document.getElementById("chips");
  var hint = document.getElementById("hint");

  /* ── 상태 ── */
  var mode = "single";          // "single" | "spread"
  var view = 0;                 // 현재 뷰(한쪽 = 쪽번호-1, 펼침 = 묶음번호)
  var W = 300, H = 450;         // 한 쪽 크기(px)
  var dpr = 1;
  var SPREAD_MIN = 700;         // 무대 폭이 이 이상이면 2쪽 펼침
  var T = null;                 // 진행 중인 넘김
  var busy = false;             // 애니메이션 중
  var raf = 0, lastT = 0;

  /* ── 뷰 계산 ── */
  function viewCount(){ return mode === "spread" ? Math.ceil(TOTAL/2) : TOTAL; }
  function leftPageOf(v){ return mode === "spread" ? (2*v+1) : (v+1); }
  function rightPageOf(v){ return mode === "spread" ? Math.min(TOTAL, 2*v+2) : (v+1); }
  function viewOfPage(p){ return mode === "spread" ? Math.floor((p-1)/2) : (p-1); }
  function curPageNum(){ return leftPageOf(view); }
  function chapterOf(n){
    var cur = CHAPS[0];
    for (var i=0;i<CHAPS.length;i++) if (CHAPS[i].p <= n) cur = CHAPS[i];
    return cur;
  }
  function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

  /* ── 크기 ── */
  function pickMode(rect){
    return (rect.width >= SPREAD_MIN && rect.width > rect.height * 0.86) ? "spread" : "single";
  }
  function relayout(){
    var cur = curPageNum();
    var r = stage.getBoundingClientRect();
    var nextMode = pickMode(r);
    if (nextMode !== mode){ cancelTurn(true); mode = nextMode; }
    book.classList.toggle("single", mode === "single");
    book.classList.toggle("spread", mode === "spread");

    var availW = Math.max(120, r.width - 4);
    var availH = Math.max(180, r.height - 14);
    if (mode === "spread"){
      W = Math.min((availW - 2) / 2, availH * (2/3));
    } else {
      W = Math.min(availW, availH * (2/3));
    }
    W = Math.max(120, Math.floor(W));
    H = Math.round(W * 1.5);
    book.style.setProperty("--bw", (mode === "spread" ? W*2 : W) + "px");
    book.style.setProperty("--bh", H + "px");
    book.style.width = (mode === "spread" ? W*2 : W) + "px";
    book.style.height = H + "px";

    canvas.style.height = H + "px";
    canvas.style.left = (mode === "spread" ? 0 : -W) + "px";

  }

  /* ── 화면 갱신 ── */
  function applyView(v){

      var lp = 2*view+1, rp = Math.min(TOTAL, 2*view+2);
      setImg(imgL, lp, PAGES[lp-1].a);

    }

  }
  function setImg(el, n, alt){

    el.src = src(n);
  }
  function ui(){
    var p = curPageNum();
    var rp = mode === "spread" ? Math.min(TOTAL, 2*view+2) : p;

    if (ac && chipsEl.scrollWidth > chipsEl.clientWidth){
      var l = ac.offsetLeft - chipsEl.clientWidth/2 + ac.offsetWidth/2;

    }

  }

  /* ════════════════════════════════════════════════════════
     WebGL 모서리 말림 엔진
     ─ 평면부(아직 안 넘어간 종이) + 원통 굽힘부 + 되접힌 날개
     ─ 뒷면은 종이색 + 비침(print-through) + 반사광
     ─ 바닥 페이지에는 곡선 그림자
     ════════════════════════════════════════════════════════ */
  var R3 = null;
  var imgCache = {};

  function imgFor(n, cb){
    var rec = imgCache[n];
    if (!rec){
      rec = imgCache[n] = { el: new Image(), ok: false, cbs: [] };
      rec.el.onload = function(){
        rec.ok = true;
        var fns = rec.cbs; rec.cbs = [];
        for (var i=0;i<fns.length;i++) fns[i]();
      };
      rec.el.src = src(n);
    }
    if (cb){ if (rec.ok) cb(); else rec.cbs.push(cb); }
    return rec.el;
  }

  /* ════════════════════════════════════════════════════════
     말림 렌더러 (Canvas 2D)
     ─ 종이 단면을 잘게 나눠 각 조각을 원근 변형해 그린다
     ─ 뒷면 종이·비침·그레인·반사광·곡선 그림자
     ════════════════════════════════════════════════════════ */
  function createRenderer(){
    var g = canvas.getContext("2d", { alpha: true });
    if (!g) return null;
    var layers = {}, lkeys = [], clock = 0, CW = 1, CH = 1;

    function resize(w, h){ CW = w; CH = h; }

    var fiberCv = null;
    function fiberTile(){
      if (fiberCv) return fiberCv;
      var n = 48;
      fiberCv = document.createElement("canvas");
      fiberCv.width = n; fiberCv.height = n;
      var q = fiberCv.getContext("2d");
      var im = q.createImageData(n, n);
      for (var i=0;i<n*n;i++){
        var v = 200 + Math.random()*55;
        im.data[i*4] = v; im.data[i*4+1] = v - 3; im.data[i*4+2] = v - 12;
        im.data[i*4+3] = 26 + Math.random()*26;
      }
      q.putImageData(im, 0, 0);
      return fiberCv;
    }

    function shadeCss(tone){
      if (tone < 1){
        var a = Math.min(0.5, 1 - tone);
        return "rgba(46,36,20," + a.toFixed(3) + ")";
      }
      var b = Math.min(0.55, (tone - 1) * 0.9);
      return "rgba(255,252,240," + b.toFixed(3) + ")";
    }

    function paint(rec){
      var c = rec.c, q = c.getContext("2d");
      q.setTransform(1,0,0,1,0,0);
      q.clearRect(0, 0, c.width, c.height);
      if (rec.back){
        var pg2 = q.createLinearGradient(0, 0, c.width, c.height);
        pg2.addColorStop(0, "#FFFCF4");
        pg2.addColorStop(0.55, "#FBF5E9");
        pg2.addColorStop(1, "#F6EFDF");
        q.fillStyle = pg2;
        q.fillRect(0, 0, c.width, c.height);
      }
      var im = imgFor(rec.n);
      if (im && im.complete && im.naturalWidth){
        if (rec.back){
          q.save();
          q.globalAlpha = 0.05;
          try { q.filter = "blur(1.2px)"; } catch(e){}
          q.translate(c.width, 0); q.scale(-1, 1);
          q.drawImage(im, 0, 0, c.width, c.height);
          q.restore();
          var gr = q.createLinearGradient(0, 0, c.width, c.height);
          gr.addColorStop(0, "rgba(255,255,255,.22)");
          gr.addColorStop(.5, "rgba(255,255,255,0)");
          gr.addColorStop(1, "rgba(228,217,194,.16)");
          q.fillStyle = gr; q.fillRect(0, 0, c.width, c.height);
          /* 종이 결 (미세 노이즈 타일) */
          var fb = fiberTile();
          if (fb){
            q.save();
            q.globalAlpha = 0.34;
            var pat = q.createPattern(fb, "repeat");
            q.fillStyle = pat;
            q.fillRect(0, 0, c.width, c.height);
            q.restore();
          }
        } else {
          q.drawImage(im, 0, 0, c.width, c.height);
        }
        rec.ready = true;
      } else {
        if (!rec.back){ q.fillStyle = "#FBF7EE"; q.fillRect(0, 0, c.width, c.height); }
        if (!rec.pending){
          rec.pending = true;
          imgFor(rec.n, function(){ rec.pending = false; paint(rec); if (T) render(); });
        }
      }
    }

    function layer(n, isBack){
      if (!n) return null;
      var lw = Math.max(1, Math.round(W*dpr)), lh = Math.max(1, Math.round(H*dpr));
      var key = n + (isBack ? "b" : "f");
      var rec = layers[key];
      if (!rec || rec.w !== lw || rec.h !== lh){
        var c = document.createElement("canvas");
        c.width = lw; c.height = lh;
        rec = layers[key] = { c: c, w: lw, h: lh, n: n, back: isBack, ready: false };
        paint(rec);
        lkeys.push(key);
        while (lkeys.length > 6){ var kk = lkeys.shift(); if (kk !== key) delete layers[kk]; }
      }
      rec.used = ++clock;
      return rec;
    }

    function polyPath(pts){
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (var i=1;i<pts.length;i++) g.lineTo(pts[i][0], pts[i][1]);
      g.closePath();
    }

    /* 사각형(0,0,W,H)을 반평면으로 자른 다각형 */
    function halfPlane(A, N, sign){
      var pts = [[0,0],[W,0],[W,H],[0,H]];
      var out = [];
      for (var i=0;i<pts.length;i++){
        var p = pts[i], q = pts[(i+1)%4];
        var dp = ((p[0]-A[0])*N[0] + (p[1]-A[1])*N[1]) * sign;
        var dq = ((q[0]-A[0])*N[0] + (q[1]-A[1])*N[1]) * sign;
        if (dp <= 0) out.push(p);
        if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)){
          var t = dp / (dp - dq);
          out.push([p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t]);
        }
      }
      return out;
    }

    /* 접힘축 방향 밴드(t0..t1) 사각형 */
    function band(A, N, T, t0, t1, half){
      var x0 = A[0] + N[0]*t0, y0 = A[1] + N[1]*t0;
      var x1 = A[0] + N[0]*t1, y1 = A[1] + N[1]*t1;
      return [[x0 - T[0]*half, y0 - T[1]*half], [x0 + T[0]*half, y0 + T[1]*half],
              [x1 + T[0]*half, y1 + T[1]*half], [x1 - T[0]*half, y1 - T[1]*half]];
    }

    function draw(st){
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, canvas.width, canvas.height);
      if (!st) return;
      var mir = st.mirror;
      g.setTransform((mir ? -1 : 1)*dpr, 0, 0, dpr, (mir ? 2*W : W)*dpr, 0);
      g.imageSmoothingEnabled = true;
      if ("imageSmoothingQuality" in g) g.imageSmoothingQuality = "high";

      var A = st.A, N = st.N, R = st.R, phi = st.phi;
      var mirD = !!st.mirror;
      function drawPage(lay){
        if (!lay) return;
        if (mirD){
          g.save(); g.transform(-1, 0, 0, 1, W, 0);
          g.drawImage(lay.c, 0, 0, W, H);
          g.restore();
        } else {
          g.drawImage(lay.c, 0, 0, W, H);
        }
      }
      var Tx = -N[1], Ty = N[0];
      var T2 = [Tx, Ty];
      var lx = mir ? -CFG.lx : CFG.lx, ly = CFG.ly, lz = CFG.lz;
      var ll = Math.sqrt(lx*lx + ly*ly + lz*lz);
      lx /= ll; ly /= ll; lz /= ll;
      var hx = lx, hy = ly, hz = lz + 1;
      var hl = Math.sqrt(hx*hx + hy*hy + hz*hz);
      hx /= hl; hy /= hl; hz /= hl;

      /* 1) 바닥 그림자 */
      if (st.sh && st.sh.bins){
        var gr = g.createLinearGradient(A[0]-N[0]*W, A[1]-N[1]*W, A[0]+N[0]*W, A[1]+N[1]*W);
        var bins = st.sh.bins, nb = bins.length, inten = st.sh.int;
        for (var i=0; i<nb; i+=2){
          var aa = (bins[i]/255) * inten;
          gr.addColorStop(Math.min(1, i/(nb-1)), "rgba(12,18,34," + aa.toFixed(3) + ")");
        }
        g.save();
        g.beginPath(); g.rect(0, 0, W, H); g.clip();
        g.fillStyle = gr;
        g.fillRect(0, 0, W, H);
        g.restore();
      }

      /* 2) 아직 넘어가지 않은 평면부 */
      var fL = layer(st.front, false);
      var bL = layer(st.back, true);
      if (fL){
        g.save();
        polyPath(halfPlane(A, N, -1));
        g.clip();
        drawPage(fL);
        /* 평면부에도 접힘선 쪽 접촉 음영 */
        var cg = g.createLinearGradient(A[0], A[1], A[0]-N[0]*Math.max(10, W*0.06), A[1]-N[1]*Math.max(10, W*0.06));
        cg.addColorStop(0, "rgba(40,32,20,0.22)");
        cg.addColorStop(1, "rgba(40,32,20,0)");
        g.fillStyle = cg;
        g.fillRect(0, 0, W, H);
        g.restore();
      }

      /* 3) 말려 올라간 날개 */
      var L = st.L || Math.hypot(W, H);
      var arc = R * phi;
      var tSplit = R * Math.PI * 0.5;
      var NS = W > 460 ? 108 : 84;

      /* 가장자리(절단면) 궤적을 먼저 구해 두고 그림자 → 날개 → 하이라이트 순으로 */
      var edges = [];
      function edgePath(fixed, vertical){
        var pts = [], n = 44, i, px, py, t, sec, along, qx, qy;
        for (i=0;i<=n;i++){
          var v = i/n;
          px = vertical ? fixed : v*W;
          py = vertical ? v*H : fixed;
          t = (px-A[0])*N[0] + (py-A[1])*N[1];
          if (t <= 0.8 || (sec = sectionAt(t, R, phi)).z < 2){ if (pts.length > 1) edges.push(pts); pts = []; continue; }
          sec = sectionAt(t, R, phi);
          along = (px-A[0])*Tx + (py-A[1])*Ty;
          qx = A[0] + Tx*along + N[0]*sec.p;
          qy = A[1] + Ty*along + N[1]*sec.p;
          pts.push([qx, qy]);
        }
        if (pts.length > 1) edges.push(pts);
      }
      edgePath(W, true); edgePath(H, false);

      function strokeAll(ptsList, dx, dy){
        for (var q=0;q<ptsList.length;q++){
          var pts = ptsList[q];
          g.beginPath();
          g.moveTo(pts[0][0]+dx, pts[0][1]+dy);
          for (var m=1;m<pts.length;m++) g.lineTo(pts[m][0]+dx, pts[m][1]+dy);
          g.stroke();
        }
      }

      /* 날개가 드리우는 부드러운 그림자 (가장자리 바깥으로) */
      g.save();
      g.lineJoin = "round"; g.lineCap = "round";
      g.strokeStyle = "rgba(26,32,52,0.055)";
      g.lineWidth = 16; strokeAll(edges, N[0]*10, N[1]*10);
      g.lineWidth = 9;  strokeAll(edges, N[0]*5, N[1]*5);
      g.strokeStyle = "rgba(26,32,52,0.075)";
      g.lineWidth = 5;  strokeAll(edges, N[0]*2, N[1]*2);
      g.restore();

      function toneAtT(t){
        var ang = (t <= arc) ? t/R : phi;
        var cs = Math.cos(ang), sn = Math.sin(ang);
        var front = cs >= 0;
        var nxr = -N[0]*sn, nyr = -N[1]*sn, nzr = cs;
        var vx = front ? nxr : -nxr, vy = front ? nyr : -nyr, vz = front ? nzr : -nzr;
        var d1 = Math.max(0, vx*lx + vy*ly + vz*lz);
        var sp = Math.pow(Math.max(0, vx*hx + vy*hy + vz*hz), 26);
        var grad = front ? (0.64 + 0.48*d1) : (0.97 + 0.20*d1);
        var crease = Math.exp(-Math.abs(t)/Math.max(8, R*0.55));
        grad -= (front ? 0.20 : 0.13) * crease;
        return grad + sp*0.62;
      }

      function drawStrip(t0, t1){
        if (t1 - t0 < 0.0001) return;
        var tm = (t0 + t1) * 0.5;
        var ang = (tm <= arc) ? tm/R : phi;
        var isFront = Math.cos(ang) >= 0;
        var s0 = sectionAt(t0, R, phi), s1 = sectionAt(t1, R, phi);

        g.save();
        polyPath(band(A, N, T2, t0, t1, W*2.2));
        g.clip();
        var den = t1 - t0;
        var kk2 = (s1.p - s0.p)/den;
        var c0 = s0.p - kk2*t0;
        var m11 = Tx*Tx + kk2*N[0]*N[0], m12 = Tx*Ty + kk2*N[0]*N[1];
        var m21 = m12, m22 = Ty*Ty + kk2*N[1]*N[1];
        g.translate(A[0], A[1]);
        g.translate(N[0]*c0, N[1]*c0);
        g.transform(m11, m21, m12, m22, 0, 0);
        g.translate(-A[0], -A[1]);
        var lay = isFront ? fL : bL;
        drawPage(lay);
        g.restore();

        var tA = toneAtT(Math.max(t0, 0.01)), tB = toneAtT(t1);
        if (Math.abs(tA - tB) < 0.006 && Math.abs(tA - 1) < 0.006) return;
        var gx0 = A[0]+N[0]*s0.p, gy0 = A[1]+N[1]*s0.p;
        var gx1 = A[0]+N[0]*s1.p, gy1 = A[1]+N[1]*s1.p;
        if (Math.abs(gx1-gx0) + Math.abs(gy1-gy0) < 0.15){ gx1 = gx0 + N[0]*0.7; gy1 = gy0 + N[1]*0.7; }
        g.save();
        polyPath(band(A, N, T2, t0, t1, W*2.2));
        g.clip();
        var gg = g.createLinearGradient(gx0, gy0, gx1, gy1);
        gg.addColorStop(0, shadeCss(tA));
        gg.addColorStop(1, shadeCss(tB));
        g.fillStyle = gg;
        g.fillRect(0, 0, W, H);
        g.restore();
      }

      for (var k=0; k<NS; k++){
        var ta = L*k/NS, tb = L*(k+1)/NS;
        if (ta < tSplit && tb > tSplit){
          drawStrip(ta, tSplit);
          drawStrip(tSplit, tb);
        } else {
          drawStrip(ta, tb);
        }
      }

      /* 종이 두께 : 잘린 가장자리 */
      g.save();
      g.lineJoin = "round"; g.lineCap = "round";
      g.strokeStyle = "rgba(92,76,48,0.26)";
      g.lineWidth = 3.4; strokeAll(edges, 0, 0);
      g.strokeStyle = "rgba(255,253,246,0.95)";
      g.lineWidth = 1.6; strokeAll(edges, N[0]*-0.5, N[1]*-0.5);
      g.restore();
    }

    return {
      gl: null,
      draw: draw,
      resize: resize,
      preload: function(n){ imgFor(n); }
    };
  }


  var profF = new Float32Array(128), profB = new Uint8Array(128), profTmp = new Float32Array(128);
  function blurProfile(a, n, r){
    if (r < 1) return;
    for (var i=0;i<n;i++) profTmp[i] = a[i];
    for (i=0;i<n;i++){
      var s0 = 0, c0 = 0;
      for (var j=-r;j<=r;j++){
        var idx2 = i + j;
        if (idx2 >= 0 && idx2 < n){ s0 += profTmp[idx2]; c0++; }
      }
      a[i] = s0 / c0;
    }
  }

  /* ── 굽힘 단면 계산 (그림자·광량용) ── */
  function sectionAt(t, R, phi){
    if (t <= 0) return { p: t, z: 0 };
    var arc = R * phi;
    if (t <= arc){
      var a = t / R;
      return { p: R*Math.sin(a), z: R*(1-Math.cos(a)) };
    }
    return { p: R*Math.sin(phi) + (t-arc)*Math.cos(phi),
             z: R*(1-Math.cos(phi)) + (t-arc)*Math.sin(phi) };
  }

  /* ── 넘김 상태 만들기 ── */
  function beginTurn(dir, N){
    if (T) return null;
    var v2 = view + dir;
    if (v2 < 0 || v2 >= viewCount()) return null;

    var o = { dir: dir, p: 0, vel: 0, target: 0, mirror: dir < 0,
              front: 0, back: 0, N: N || diagonalN(dir), sm: 0 };
    o.sm = sMaxFor(o.N, dir);

    if (mode === "spread"){
      if (dir > 0){
        o.front = 2*view + 2;
        o.back  = Math.min(TOTAL, 2*view + 3);
        setImg(imgR, Math.min(TOTAL, 2*view + 4), PAGES[Math.min(TOTAL,2*view+4)-1].a); /* 드러나는 다음 오른쪽 쪽 */
      } else {
        o.front = 2*view + 1;
        o.back  = Math.max(1, 2*view);
        setImg(imgL, Math.max(1, 2*view - 1), PAGES[Math.max(1,2*view-1)-1].a);       /* 드러나는 이전 왼쪽 쪽 */
      }
    } else {
      if (dir > 0){
        o.front = view + 1;
        o.back  = view + 1;
        setImg(imgR, Math.min(TOTAL, view + 2), PAGES[Math.min(TOTAL,view+2)-1].a);   /* 드러나는 다음 쪽 */
      } else {
        o.front = view;                     /* 되돌아 들어오는 이전 쪽 */
        o.back  = view;
        /* imgR 은 현재 쪽 그대로 = 날개 밑에 깔림 */
      }
    }
    T = o;
    canvas.style.opacity = "1";
    render();
    return o;
  }

  function diagonalN(dir){
    /* 책등 쪽(안쪽) 대각선 : 한쪽 보기/펼침 모두 같은 날개 좌표계 */
    var d = Math.hypot(W, H);
    return [W/d, H/d];
  }
  function sMaxFor(N, dir){
    /* 모서리(W,H)에서 -N 방향으로 쪽 경계까지 */
    var cx = W, cy = H, best = 1e9;
    var dx = -N[0], dy = -N[1];
    if (dx < -1e-4) best = Math.min(best, (0 - cx) / dx);
    if (dx >  1e-4) best = Math.min(best, (W - cx) / dx);
    if (dy < -1e-4) best = Math.min(best, (0 - cy) / dy);
    if (dy >  1e-4) best = Math.min(best, (H - cy) / dy);
    if (!isFinite(best) || best <= 0) best = Math.hypot(W,H);
    return Math.max(60, best);
  }

  /* 시각 파라미터 (검증용으로 바꿔 볼 수 있음) */
  var CFG = { phiMin: 0.70, phiMax: 0.98, phiExp: 0.35, rFrac: 0.05, rMax: 30,
              lx: -0.42, ly: -0.52, lz: 0.82 };

  /* ── 그리기 ── */
  function clearCanvas(){
    canvas.style.opacity = "1";
    if (!R3) return;
    var c2 = canvas.getContext("2d");
    if (c2) c2.clearRect(0, 0, canvas.width, canvas.height);
  }

  function render(){
    if (!R3) return;
    if (!T){ clearCanvas(); return; }
    var p = clamp(T.p, 0, 1);
    if (p <= 0.0005){
      clearCanvas();
      /* 아직 평평 : 캔버스 비우고 DOM 쪽지만 */
      return;
    }
    var phi = Math.PI * (CFG.phiMin + (CFG.phiMax - CFG.phiMin) * Math.pow(p, CFG.phiExp));
    var R = clamp(W * CFG.rFrac, 10, CFG.rMax);
    var s = p * T.sm;
    var A = [W - T.N[0]*s, H - T.N[1]*s];

    /* 날개 길이(L)와 되접힌 쪽 그림자 폭 */
    var cxs = [0, W, 0, W], cys = [0, 0, H, H], L = 0, i2;
    for (i2=0;i2<4;i2++){
      var tc = (cxs[i2]-A[0])*T.N[0] + (cys[i2]-A[1])*T.N[1];
      if (tc > L) L = tc;
    }
    var arc = R * phi;
    var negW = Math.max(0, -(R*Math.sin(phi) + Math.max(0, L-arc)*Math.cos(phi)));

    /* 빛 투영 계수 : 높이 z 인 점의 그림자가 N 방향으로 z*kL 만큼 밀린다 */
    var kL = -((CFG.lx*T.N[0] + CFG.ly*T.N[1]) / CFG.lz);

    /* 그림자 프로파일 (1D) — 날개 단면을 바닥에 투영해 만든다 */
    var PN = 128, NS = 110, acc = 0, cnt = 0, i3;
    for (i3=0;i3<PN;i3++) profF[i3] = 0;
    for (i3=0;i3<NS;i3++){
      var tt = L * (i3 + 0.5) / NS;
      var sec = sectionAt(tt, R, phi);
      acc += sec.z; cnt++;
      var bi = Math.floor(((sec.p + kL*sec.z) + W) / (2*W) * PN);
      if (bi >= 0 && bi < PN) profF[bi] += 1;
    }
    var meanZ = cnt ? acc/cnt : 0;
    var inten = clamp(0.20 + 0.62 * (meanZ / (0.42*W)), 0, 0.52) * clamp(p*6, 0, 1);

    /* 누적 → 알파, 부드럽게 (박스 블러 3회) */
    for (i3=0;i3<PN;i3++) profF[i3] = 1 - Math.exp(-profF[i3]*0.95);
    var blurR = 3 + Math.round(clamp(meanZ / (0.10*W), 0, 4));
    blurProfile(profF, PN, blurR);
    blurProfile(profF, PN, blurR);
    for (i3=0;i3<PN;i3++) profB[i3] = Math.round(clamp(profF[i3], 0, 1) * 255);

    var fade = 1;
    if (p > 0.955) fade = clamp((1 - p) / 0.045, 0, 1);

    R3.draw({
      A: A, N: T.N, R: R, phi: phi, L: L,
      mirror: T.mirror, front: T.front, back: T.back,
      fade: fade,
      sh: { bins: profB, int: inten }
    });
  }

  /* ── 스프링 애니메이션 ── */
  function animateTo(target, kind){
    if (!T) return;
    T.target = target;
    busy = true;
    lastT = 0;
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step(now){
    raf = 0;
    if (!T){ busy = false; return; }
    var dt = lastT ? Math.min(0.10, (now - lastT)/1000) : 0.016;
    lastT = now;
    var back = T.target <= 0.001;
    var k = back ? 340 : 170;
    var zeta = back ? 0.60 : 1.0;
    var c = 2*Math.sqrt(k)*zeta;
    var n = Math.max(1, Math.ceil(dt/0.008)), h = dt/n;
    for (var i=0;i<n;i++){
      var a = -k*(T.p - T.target) - c*T.vel;
      T.vel += a*h;
      T.p += T.vel*h;
    }
    if (T.p < 0) T.p = 0;
    if (T.p > 1.0) T.p = 1.0;
    if (Math.abs(T.p - T.target) < 0.004 && Math.abs(T.vel) < 0.08){
      T.p = T.target;
      render();
      if (T.target >= 0.999) finishTurn();
      else cancelTurn();
      return;
    }
    render();
    raf = requestAnimationFrame(step);
  }

  function finishTurn(){
    var d = T.dir;
    T = null; busy = false;
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    applyView(view + d);
    clearCanvas();
  }
  function cancelTurn(silent){
    if (!T){
      if (!silent){ applyView(view); clearCanvas(); }
      return;
    }
    T = null; busy = false;
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    applyView(view);
    clearCanvas();
  }

  /* ── 프로그램적 넘김 ── */
  function turn(dir){
    if (T || busy) return;
    if (view + dir < 0 || view + dir >= viewCount()){ bump(dir); return; }
    var o = beginTurn(dir, null);
    if (!o) { bump(dir); return; }
    o.p = 0.001;
    animateTo(1, "auto");
  }

  function bump(dir){
    if (busy) return;
    var b = book;
    b.style.transition = "transform 160ms ease";
    b.style.transform = "translateX(" + (dir > 0 ? -7 : 7) + "px)";
    setTimeout(function(){
      b.style.transform = "translateX(0)";
      setTimeout(function(){ b.style.transform = ""; b.style.transition = ""; }, 180);
    }, 130);
    toastMsg(dir > 0 ? "마지막 쪽입니다" : "첫 쪽입니다");
  }

  /* ── 칩 ── */
  var chipEls = CHAPS.map(function(c){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = c.n;
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){ goToPage(c.p); });
    chipsEl.appendChild(b);
    return b;
  });

  function goToPage(n){
    if (T || busy) return;
    n = clamp(n, 1, TOTAL);
    var v = clamp(viewOfPage(n), 0, viewCount()-1);
    if (v === view){ ui(); return; }
    if (Math.abs(v - view) === 1){
      /* 한 장 차이면 실제로 넘긴다 */
      var dir = v > view ? 1 : -1;
      var o = beginTurn(dir, null);
      if (!o) return;
      o.p = 0.001;
      animateTo(1, "auto");
      return;
    }
    /* 멀리 : 부드러운 크로스페이드 */
    var pg = pageR.parentNode;
    pageR.style.transition = "opacity 150ms ease";
    pageR.style.opacity = "0.15";
    setTimeout(function(){
      view = v; applyView(view);
      pageR.style.opacity = "1";
      setTimeout(function(){ pageR.style.transition = ""; pageR.style.opacity = ""; }, 160);
    }, 130);
  }

  /* ════════════════════════════════════════════════════════
     손가락 / 마우스 : 1:1 모서리 따라가기
     ════════════════════════════════════════════════════════ */
  var pointers = {};
  var drag = null;
  var pinch = null;
  var tapT = 0, tapX = 0, tapY = 0;
  var lastMoveT = 0;

  function ptrCount(){ var n=0; for (var k in pointers) if (pointers[k]) n++; return n; }

  function onDown(e){
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointers[e.pointerId] = true;
    if (ptrCount() > 1){
      /* 두 손가락 : 넘김 취소 (확대는 touchend 쪽에서 판정) */
      if (drag){ drag = null; if (T) animateTo(0, "back"); }
      pinch = true;
      return;
    }
    if (T && busy) return;
    try { stage.setPointerCapture(e.pointerId); } catch(err){}
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY,
             t: performance.now(), active: false, dir: 0, moved: 0, dead: false, T: null,
             lastP: 0, lastMove: performance.now() };
  }

  function onMove(e){
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.dead) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    drag.moved = Math.hypot(dx, dy);
    drag.px = e.clientX; drag.py = e.clientY;

    if (!drag.active){
      if (Math.abs(dx) < 9) return;
      if (Math.abs(dy) > Math.abs(dx) * 1.15){ drag.dead = true; return; }
      drag.dir = dx < 0 ? 1 : -1;
      var N = foldNormal(drag.dir, drag.dir * dx, dy);
      var o = beginTurn(drag.dir, N);
      if (!o){ drag.dead = true; drag.refused = true; bump(drag.dir); return; }
      drag.active = true;
      drag.T = o;
      drag.lastP = 0;
      drag.lastMove = performance.now();
    }

    /* 손가락 → 접힘축 */
    var ldx = drag.dir * dx, ldy = dy;
    var dist = Math.max(0, -ldx);
    var Nd = foldNormal(drag.dir, ldx, ldy);
    T.N = Nd;
    T.sm = sMaxFor(Nd, drag.dir);
    var np = clamp(0.62 * dist / T.sm, 0, 1);

    var now = performance.now(), dts = Math.max(8, now - drag.lastMove) / 1000;
    T.vel = clamp((np - T.p) / dts, -4, 4) * 0.55;
    T.p = np;
    drag.lastMove = now;
    render();
  }

  function foldNormal(dir, dx, dy){
    var vx = -dx, vy = -dy;             /* 접힘축 → 손가락 반대 = 모서리 쪽 */
    var m = Math.hypot(vx, vy) || 1;
    vx /= m; vy /= m;
    var dg = diagonalN(dir);            /* 책 안쪽 대각선 = 모서리 방향 */
    var nx = 0.5*vx + 0.5*dg[0];
    var ny = 0.5*vy + 0.5*dg[1];
    var nn = Math.hypot(nx, ny) || 1;
    return [nx/nn, ny/nn];
  }

  function onUp(e){
    if (!pointers[e.pointerId] && !drag) { return; }
    delete pointers[e.pointerId];
    if (pinch && ptrCount() < 2) pinch = null;

    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    if (!d.active){
      if (d.moved < 9 && !d.dead) handleTap(e, d);
      return;
    }
    if (!T) return;
    var commit = (T.p > 0.24) || (T.p > 0.02 && T.vel > 0.85);
    if (T.p > 0.985) commit = true;
    busy = false;
    animateTo(commit ? 1 : 0, commit ? "auto" : "back");
    if (hint) hint.style.opacity = "0";
  }

  function onCancel(e){
    delete pointers[e.pointerId];
    if (pinch && ptrCount() < 2) pinch = null;
    if (drag && e.pointerId === drag.id){
      var d = drag; drag = null;
      if (d.active && T){ animateTo(0, "back"); }
    }
  }

  function handleTap(e, d){
    var now = performance.now();
    if (now - tapT < 330 && Math.hypot(e.clientX - tapX, e.clientY - tapY) < 42){
      tapT = 0;
      openZoom(pageUnder(e.clientX, e.clientY));
      return;
    }
    tapT = now; tapX = e.clientX; tapY = e.clientY;
  }

  function pageUnder(cx, cy){
    if (mode === "single") return view + 1;
    var r = book.getBoundingClientRect();
    return (cx < r.left + r.width/2) ? (2*view+1) : Math.min(TOTAL, 2*view+2);
  }

  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", onCancel);
  stage.addEventListener("lostpointercapture", onCancel);

  /* 두 손가락 거리 추적 (확대 보기 진입) */
  var twoPts = null;
  stage.addEventListener("touchstart", function(e){
    if (e.touches.length === 2){
      twoPts = { d: Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), x:e.touches[0].clientX, y:e.touches[0].clientY };
    }
  }, {passive:true});
  stage.addEventListener("touchmove", function(e){
    if (twoPts && e.touches.length === 2){
      var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if (d > twoPts.d * 1.35 && d > 60){
        var px = twoPts.x, py = twoPts.y;
        twoPts = null;
        openZoom(pageUnder(px, py));
      }
    }
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if (e.touches.length < 2) twoPts = null;
  }, {passive:true});

  prevBtn.addEventListener("click", function(){ turn(-1); });
  nextBtn.addEventListener("click", function(){ turn(1); });

  /* 키보드 */
  document.addEventListener("keydown", function(e){
    if (document.getElementById("zoom").classList.contains("on")){
      if (e.key === "Escape") closeZoom();
      if (e.key === "ArrowRight" || e.key === "PageDown") zNav(1);
      if (e.key === "ArrowLeft" || e.key === "PageUp") zNav(-1);
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); turn(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); turn(-1); }
    else if (e.key === "Home"){ e.preventDefault(); goToPage(1); }
    else if (e.key === "End"){ e.preventDefault(); goToPage(TOTAL); }
  });
  /* 데스크톱 휠 */
  var wheelLock = 0;
  stage.addEventListener("wheel", function(e){
    var now = Date.now();
    if (now < wheelLock) return;
    if (Math.abs(e.deltaY) < 8 && Math.abs(e.deltaX) < 8) return;
    e.preventDefault();
    wheelLock = now + 480;
    turn((e.deltaY || e.deltaX) > 0 ? 1 : -1);
  }, { passive: false });

  /* ════════════════════════════════════════════════════════
     확대 보기 : 드래그 = 화면 이동(팬)
     ════════════════════════════════════════════════════════ */
  var zoom = document.getElementById("zoom");
  var zStage = document.getElementById("zStage");
  var zImg = document.getElementById("zImg");
  var zs = 1, zx = 0, zy = 0;

  function zApply(){
    if (zs <= 1.001){ zs = 1; zx = 0; zy = 0; }
    var r = zStage.getBoundingClientRect();
    var iw = zImg.clientWidth * zs, ih = zImg.clientHeight * zs;
    var mx = Math.max(0, (iw - r.width) / 2 + 12);
    var my = Math.max(0, (ih - r.height) / 2 + 12);
    zx = Math.max(-mx, Math.min(mx, zx));
    zy = Math.max(-my, Math.min(my, zy));
    zImg.style.transform = "translate3d(" + zx + "px," + zy + "px,0) scale(" + zs + ")";
  }
  function zSet(s, cx, cy){
    s = Math.max(1, Math.min(5, s));
    if (cx == null){ cx = 0; cy = 0; }
    var k = s / zs;
    zx = cx - k * (cx - zx);
    zy = cy - k * (cy - zy);
    zs = s;
    zApply();
  }
  function openZoom(n){
    n = clamp(n || curPageNum(), 1, TOTAL);
    zImg.src = src(n);
    zImg.alt = PAGES[n-1].a;
    zs = 1; zx = 0; zy = 0; zApply();
    zoom.classList.add("on");
    document.getElementById("zTitle").textContent = PAGES[n-1].t + " · " + n + " / " + TOTAL + "쪽";
    zoomPage = n;
  }
  var zoomPage = 1;
  function closeZoom(){ zoom.classList.remove("on"); zs = 1; zx = 0; zy = 0; zImg.style.transform = ""; }
  function zNav(d){
    var n = clamp(zoomPage + d, 1, TOTAL);
    if (n === zoomPage) return;
    zoomPage = n;
    zImg.src = src(n); zImg.alt = PAGES[n-1].a;
    zs = 1; zx = 0; zy = 0; zApply();
    document.getElementById("zTitle").textContent = PAGES[n-1].t + " · " + n + " / " + TOTAL + "쪽";
    if (!T && !busy){
      var v = clamp(viewOfPage(n), 0, viewCount()-1);
      if (v !== view) applyView(v);
    }
  }
  document.getElementById("zoomBtn").addEventListener("click", function(){ openZoom(curPageNum()); });
  document.getElementById("zClose").addEventListener("click", closeZoom);
  document.getElementById("zIn").addEventListener("click", function(){ zSet(zs * 1.5); });
  document.getElementById("zOut").addEventListener("click", function(){ zSet(zs / 1.5); });
  document.getElementById("zPrev").addEventListener("click", function(){ zNav(-1); });
  document.getElementById("zNext").addEventListener("click", function(){ zNav(1); });

  var zp = [], zStart = null, zTap = 0, zTapX = 0, zTapY = 0;
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  zStage.addEventListener("pointerdown", function(e){
    try { zStage.setPointerCapture(e.pointerId); } catch(err){}
    zp.push({ id: e.pointerId, x: e.clientX, y: e.clientY });
    if (zp.length === 1){
      zStart = { x: e.clientX, y: e.clientY, tx: zx, ty: zy, s: zs, d: 0 };
    } else if (zp.length === 2){
      zStart = { d: dist(zp[0], zp[1]), s: zs, tx: zx, ty: zy };
    }
  });
  zStage.addEventListener("pointermove", function(e){
    var i = -1;
    for (var j=0;j<zp.length;j++) if (zp[j].id === e.pointerId) i = j;
    if (i < 0) return;
    zp[i].x = e.clientX; zp[i].y = e.clientY;
    if (!zStart) return;
    e.preventDefault();
    if (zp.length === 1 && zStart.s){
      zx = zStart.tx + (e.clientX - zStart.x);
      zy = zStart.ty + (e.clientY - zStart.y);
      zStart.d = Math.hypot(e.clientX - zStart.x, e.clientY - zStart.y);
      zApply();
    } else if (zp.length === 2 && zStart.d){
      var r = zStage.getBoundingClientRect();
      var s = Math.max(1, Math.min(5, zStart.s * (dist(zp[0], zp[1]) / zStart.d)));
      var cx = (zp[0].x + zp[1].x)/2 - (r.left + r.width/2);
      var cy = (zp[0].y + zp[1].y)/2 - (r.top + r.height/2);
      zs = zStart.s; zx = zStart.tx; zy = zStart.ty;
      zSet(s, cx, cy);
    }
  }, { passive: false });
  function zUp(e){
    zp = zp.filter(function(p){ return p.id !== e.pointerId; });
    if (zp.length === 0){
      if (zStart && zStart.d < 8 && zs === zStart.s){
        var now = Date.now();
        if (now - zTap < 320 && Math.hypot(e.clientX - zTapX, e.clientY - zTapY) < 40){
          var r = zStage.getBoundingClientRect();
          zSet(zs > 1.2 ? 1 : 2.4, e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
          zTap = 0;
        } else { zTap = now; zTapX = e.clientX; zTapY = e.clientY; }
      }
      zStart = null;
    } else if (zp.length === 1){
      zStart = { x: zp[0].x, y: zp[0].y, tx: zx, ty: zy, s: zs, d: 0 };
    }
  }
  zStage.addEventListener("pointerup", zUp);
  zStage.addEventListener("pointercancel", zUp);
  zStage.addEventListener("wheel", function(e){
    e.preventDefault();
    var r = zStage.getBoundingClientRect();
    zSet(zs * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
  }, { passive: false });
  window.addEventListener("resize", function(){ if (zoom.classList.contains("on")) zApply(); });

  /* ── 공유 ── */
  function toastMsg(m){
    var t = document.getElementById("toast");
    t.textContent = m; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1900);
  }
  var home = location.origin + location.pathname;
  document.getElementById("shareBtn").addEventListener("click", async function(){
    var url = home;
    var data = { title: "조합원 노동법 수첩 2026 · 전 22쪽", text: "일하다 궁금할 때 한 번씩 펴 보는 노동법 수첩. 폰에서 책처럼 넘겨 보세요.", url: url };
    try {
      if (navigator.share){ await navigator.share(data); return; }
      await navigator.clipboard.writeText(url);
      toastMsg("링크를 복사했어요. 단톡방에 붙여 넣으세요");
    } catch(err){
      if (err && err.name === "AbortError") return;
      try { await navigator.clipboard.writeText(url); toastMsg("링크를 복사했어요. 단톡방에 붙여 넣으세요"); }
      catch(e2){ toastMsg("주소창의 주소를 복사해 공유해 주세요"); }
    }
  });

  /* ── 시작 ── */
  R3 = createRenderer();

  function fromHash(){
    var m = (location.hash || "").match(/p=(\d+)/);
    return m ? clamp(parseInt(m[1],10), 1, TOTAL) : 1;
  }
  mode = "single"; view = 0;
  var startPage = fromHash();
  relayout();
  view = clamp(viewOfPage(startPage), 0, viewCount()-1);
  applyView(view);

  window.addEventListener("resize", function(){
    var cur = curPageNum();
    relayout();
    view = clamp(viewOfPage(cur), 0, viewCount()-1);
    applyView(view);
  });
  window.addEventListener("orientationchange", function(){ setTimeout(function(){ window.dispatchEvent(new Event("resize")); }, 160); });
  window.addEventListener("hashchange", function(){
    var n = fromHash();
    if (n !== curPageNum() && !T && !busy) goToPage(n);
  });

  /* 미리 받기 */
  var q = [];
  for (var i=1;i<=TOTAL;i++) q.push(i);
  function pump(){
    if (!q.length) return;
    var n = q.shift();
    var im = new Image();
    im.onload = im.onerror = function(){ setTimeout(pump, 55); };
    im.src = src(n);
  }
  if ("requestIdleCallback" in window) requestIdleCallback(function(){ pump(); }, { timeout: 1600 });
  else setTimeout(pump, 700);
})();
</script>
</body>
</html>
